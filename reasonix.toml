int(f'template {t:<12} open={open_n:<3} close={close_n:<3} {\"OK\" if open_n == close_n else \"MISMATCH\"}')\n\n# 2) script 部分提取并做基础语法检查\nscript = src.split('<script>')[1].split('</script>')[0]\ntry:\n    compile(script, 'weekly-meal-script', 'exec')\n    print('script compile: OK')\nexcept SyntaxError as e:\n    print('script compile: FAIL', e)\n\n# 3) 确认无 seedPlan 残留\nprint('seedPlan remains:', src.count('seedPlan'))\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\n\n# 模板区间：从 <template> 到最后一个 </template>（vue 内部 template 也成对，用 rfind）\nstart = src.find('<template>')\nend = src.rfind('</template>')\ntpl = src[start:end]\nfor t in ['view', 'scroll-view', 'text', 'template', 'input']:\n    open_n = len(re.findall(r'<%s[\\s>]' % t, tpl))\n    close_n = len(re.findall(r'</%s>' % t, tpl))\n    print(f'template {t:<12} open={open_n:<3} close={close_n:<3} {\"OK\" if open_n == close_n else \"MISMATCH\"}')\n\n# 脚本括号平衡（粗查）\nscript = src.split('<script>')[1].split('</script>')[0]\nfor a, b in [('{', '}'), ('(', ')'), ('[', ']')]:\n    print(f'script {a}{b}: {script.count(a)} / {script.count(b)}', 'OK' if script.count(a) == script.count(b) else 'MISMATCH')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nprint('总行数:', src.count('\\n') + 1)\nprint('seedPlan 残留:', src.count('seedPlan'))\nprint('演示数据残留 番茄炒蛋:', src.count('番茄炒蛋'))\nprint('存储 key 前缀:', 'weekly-meal:' in src)\nprint('deep watch 保存:', 'deep: true, flush' in src)\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\nfor a, b in [('{', '}'), ('(', ')'), ('[', ']')]:\n    print(f'{a}{b}: {script.count(a)} / {script.count(b)}', 'OK' if script.count(a) == script.count(b) else 'MISMATCH')\n\n# 确认 copyLastWeek 完整段落\nimport re\nm = re.search(r'// 复制上周.*?\\n\\t\\t}', script, re.S)\nprint('--- copyLastWeek 段落 ---')\nprint(m.group(0))\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\n# 去掉注释后统计\nclean = re.sub(r'//[^\\n]*', '', script)\nprint(f'去注释后 ( ): {clean.count(\"(\")} / {clean.count(\")\")}', 'OK' if clean.count('(') == clean.count(')') else 'MISMATCH')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport datetime\nnow = datetime.date(2026, 7, 17)  # 周五，模拟\"今天\"\ndow = now.isoweekday()  # 周一=1 ... 周日=7\n\ndef mondayOf(offset):\n    return now + datetime.timedelta(days=(-dow + 1 + offset * 7))\n\nprint('offset=0 (本周一):', mondayOf(0), '→', mondayOf(0).isoweekday() == 1)\nprint('offset=+1:', mondayOf(1), '→ 这是哪一周？')\nprint('offset=-1:', mondayOf(-1), '→ 这是哪一周？')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport datetime, json, re\n\n# 模拟与页面一致的核心逻辑（mondayOf/weekKey/loadPlan/copyLastWeek 方向）\nnow = datetime.date(2026, 7, 17)  # 周五\ndow = now.isoweekday()\n\ndef mondayOf(offset):\n    return now + datetime.timedelta(days=(-dow + 1 + offset * 7))\n\ndef weekKey(offset):\n    m = mondayOf(offset)\n    return f'weekly-meal:{m.year}-{m.month:02d}-{m.day:02d}'\n\nstorage = {}\n\n# 1) 用户切到上周（offset=-1）并添加了一道菜\nstorage[weekKey(-1)] = json.dumps([{'breakfast': [{'name': '豆浆', 'done': False}]} if i == 1 else {} for i in range(7)])\n\n# 2) 本周（offset=0）点\"复制上周计划\"\nweekOffset = 0\nlast_raw = storage.get(weekKey(weekOffset - 1), '')\nlast = json.loads(last_raw) if last_raw else None\ncount = 0\nfor m in ['breakfast', 'lunch', 'dinner', 'snack']:\n    for d in range(7):\n        count += len(last[d].get(m, [])) if last else 0\nprint('复制上周读取 key:', weekKey(weekOffset - 1))\nprint('上周菜数:', count, '→', '复制成功' if count else '上周暂无计划')\n\n# 3) 反向确认旧的错误写法（+1）确实会失败\nprint('旧代码(+1)读取 key:', weekKey(weekOffset + 1), '→ 数据存在?', weekKey(weekOffset + 1) in storage)\n\n# 4) 检查页面所有 loadPlan/savePlan 调用方向\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nfor line in src.split('\\n'):\n    if 'loadPlan(' in line or 'savePlan(' in line or 'weekKey(' in line:\n        print('调用点:', line.strip())\nEOF"]
