MATCH')\n\n# 确认 copyLastWeek 完整段落\nimport re\nm = re.search(r'// 复制上周.*?\\n\\t\\t}', script, re.S)\nprint('--- copyLastWeek 段落 ---')\nprint(m.group(0))\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\n# 去掉注释后统计\nclean = re.sub(r'//[^\\n]*', '', script)\nprint(f'去注释后 ( ): {clean.count(\"(\")} / {clean.count(\")\")}', 'OK' if clean.count('(') == clean.count(')') else 'MISMATCH')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport datetime\nnow = datetime.date(2026, 7, 17)  # 周五，模拟\"今天\"\ndow = now.isoweekday()  # 周一=1 ... 周日=7\n\ndef mondayOf(offset):\n    return now + datetime.timedelta(days=(-dow + 1 + offset * 7))\n\nprint('offset=0 (本周一):', mondayOf(0), '→', mondayOf(0).isoweekday() == 1)\nprint('offset=+1:', mondayOf(1), '→ 这是哪一周？')\nprint('offset=-1:', mondayOf(-1), '→ 这是哪一周？')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport datetime, json, re\n\n# 模拟与页面一致的核心逻辑（mondayOf/weekKey/loadPlan/copyLastWeek 方向）\nnow = datetime.date(2026, 7, 17)  # 周五\ndow = now.isoweekday()\n\ndef mondayOf(offset):\n    return now + datetime.timedelta(days=(-dow + 1 + offset * 7))\n\ndef weekKey(offset):\n    m = mondayOf(offset)\n    return f'weekly-meal:{m.year}-{m.month:02d}-{m.day:02d}'\n\nstorage = {}\n\n# 1) 用户切到上周（offset=-1）并添加了一道菜\nstorage[weekKey(-1)] = json.dumps([{'breakfast': [{'name': '豆浆', 'done': False}]} if i == 1 else {} for i in range(7)])\n\n# 2) 本周（offset=0）点\"复制上周计划\"\nweekOffset = 0\nlast_raw = storage.get(weekKey(weekOffset - 1), '')\nlast = json.loads(last_raw) if last_raw else None\ncount = 0\nfor m in ['breakfast', 'lunch', 'dinner', 'snack']:\n    for d in range(7):\n        count += len(last[d].get(m, [])) if last else 0\nprint('复制上周读取 key:', weekKey(weekOffset - 1))\nprint('上周菜数:', count, '→', '复制成功' if count else '上周暂无计划')\n\n# 3) 反向确认旧的错误写法（+1）确实会失败\nprint('旧代码(+1)读取 key:', weekKey(weekOffset + 1), '→ 数据存在?', weekKey(weekOffset + 1) in storage)\n\n# 4) 检查页面所有 loadPlan/savePlan 调用方向\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nfor line in src.split('\\n'):\n    if 'loadPlan(' in line or 'savePlan(' in line or 'weekKey(' in line:\n        print('调用点:', line.strip())\nEOF", "Bash=python3 -c \"import json; json.load(open('pages.json')); print('pages.json 合法')\"; echo \"---\"; git show f3a48da --stat | head -30", "Bash=python3 -c \"import json; m=json.load(open('manifest.json')); print('manifest 合法, appid:', m.get('appid')); print('vue版本:', m.get('vueVersion')); print('mp-weixin:', m.get('mp-weixin'))\"", "Bash=echo \"=== App 端 app-service.js 是否残留微信专用 API（应为 0）===\"; grep -c \"getMenuButtonBoundingClientRect\" unpackage/dist/build/app-plus/app-service.js; echo; echo \"=== manifest permissions 完整列表 ===\"; python3 - <<'EOF'\nimport re\nsrc = open('manifest.json', encoding='utf-8').read()\nperms = re.findall(r'android\\.permission\\.(\\w+)', src)\nprint(perms)\nprint('INTERNET:', 'INTERNET' in perms)\nEOF\necho; echo \"=== api/request.js 请求封装（App 端有无特殊处理）===\"; head -30 api/request.js", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\n\n# 1) 残留检查\nfor word in ['loadPlan', 'savePlan', 'weekKey', 'STORAGE_PREFIX', 'setStorageSync', 'getStorageSync']:\n    print(f'残留 {word}:', src.count(word))\n\n# 2) 模板标签配对\nstart = src.find('<template>')\nend = src.rfind('</template>')\ntpl = src[start:end]\nfor t in ['view', 'scroll-view', 'text', 'template', 'input', 'block']:\n    open_n = len(re.findall(r'<%s[\\s>]' % t, tpl))\n    close_n = len(re.findall(r'</%s>' % t, tpl))\n    print(f'template {t:<12} open={open_n:<3} close={close_n:<3} {\"OK\" if open_n == close_n else \"MISMATCH\"}')\n\n# 3) script 语法编译\nscript = src.split('<script>')[1].split('</script>')[0]\ntry:\n    compile(script, 'weekly-meal-script', 'exec')\n    print('script compile: OK')\nexcept SyntaxError as e:\n    print('script compile: FAIL', e)\n\n# 4) 括号平衡（去注释）\nclean = re.sub(r'//[^\\n]*', '', script)\nfor a, b in [('{', '}'), ('(', ')'), ('[', ']')]:\n    ok = clean.count(a) == clean.count(b)\n    print(f'script {a}{b}: {clean.count(a)} / {clean.count(b)}', 'OK' if ok else 'MISMATCH')\n\n# 5) api/meal-plan.js 编译\napi = open('api/meal-plan.js', encoding='utf-8').read()\ntry:\n    compile(api, 'meal-plan-api', 'exec')\n    print('api/meal-plan.js compile: OK')\nexcept SyntaxError as e:\n    print('api/meal-plan.js compile: FAIL', e)\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\nlines = script.split('\\n')\nfor i in range(28, 36):\n    print(i + 1, repr(lines[i]))\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\n\ndef check_js(src, name):\n    # 剥掉字符串字面量（含模板字符串、注释），再检查括号/引号平衡\n    # 1) 先剥注释\n    s = re.sub(r'//[^\\n]*', '', src)\n    s = re.sub(r'/\\*.*?\\*/', '', s, flags=re.S)\n    # 2) 剥字符串：把内容替换为 's'，保留引号本身便于检查配对\n    out = []\n    i = 0\n    n = len(s)\n    while i < n:\n        c = s[i]\n        if c in ('\"', \"'\", '`'):\n            quote = c\n            j = i + 1\n            while j < n:\n                if s[j] == '\\\\':\n                    j += 2\n                    continue\n                if s[j] == quote:\n                    break\n                j += 1\n            out.append(quote + quote)\n            i = j + 1\n        else:\n            out.append(c)\n            i += 1\n    s = ''.join(out)\n    # 3) 括号与引号平衡\n    for a, b in [('{', '}'), ('(', ')'), ('[', ']'), ('\"', '\"'), (\"'\", \"'\"), ('`', '`')]:\n        ok = s.count(a) == s.count(b)\n        print(f'{name} {a}{b}: {s.count(a)} / {s.count(b)}', 'OK' if ok else 'MISMATCH')\n\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\ncheck_js(script, 'weekly-meal script')\ncheck_js(open('api/meal-plan.js', encoding='utf-8').read(), 'api/meal-plan.js')\ncheck_js(open('api/diary.js', encoding='utf-8').read(), 'api/diary.js (参照)')\nEOF", "Bash=cd /Users/wangxiaojie/code/code3/calendar && python3 - <<'EOF'\nimport re\nsrc = open('pages/weekly-meal/index.vue', encoding='utf-8').read()\nscript = src.split('<script>')[1].split('</script>')[0]\n# 剥注释与字符串\ns = re.sub(r'//[^\\n]*', '', script)\ns = re.sub(r'/\\*.*?\\*/', '', s, flags=re.S)\nout = []\ni, n = 0, len(s)\nwhile i < n:\n    c = s[i]\n    if c in ('\"', \"'\", '`'):\n        q, j = c, i + 1\n        while j < n:\n            if s[j] == '\\\\': j += 2; continue\n            if s[j] == q: break\n            j += 1\n        out.append(q + q); i = j + 1\n    else:\n        out.append(c); i += 1\ns = ''.join(out)\nfor a, b in [('{', '}'), ('(', ')'), ('[', ']'), ('\"', '\"'), (\"'\", \"'\"), ('`', '`')]:\n    ok = s.count(a) == s.count(b)\n    print(f'{a}{b}: {s.count(a)} / {s.count(b)}', 'OK' if ok else 'MISMATCH')\n# 模板标签\nstart, end = src.find('<template>'), src.rfind('</template>')\ntpl = src[start:end]\nfor t in ['view', 'scroll-view', 'text', 'template', 'input']:\n    o = len(re.findall(r'<%s[\\s>]' % t, tpl)); c = len(re.findall(r'</%s>' % t, tpl))\n    print(f'tpl {t}: {o}/{c}', 'OK' if o == c else 'MISMATCH')\nEOF"]
